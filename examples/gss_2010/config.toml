# The config of a run with a model. Check it against the instrument's DDI with
# `qretools-harness check-config config.toml`.

# The instrument's DDI: the GSS 2010 instrument in the v15 release of qretools-gss, on
# its site. It can also be a path to a DDI file that `qretools build` wrote; a relative
# path starts from the folder of this file. A tag reference (owner/repo@tag:name) isn't
# accepted: give the URL of the DDI in the release.
# Write this key before the first [table]: after one, TOML puts it in that table.
instrument = "https://jhucities.github.io/qretools-gss/v15/instruments/gss_2010.json"

[model]
endpoint = "http://127.0.0.1:9931/v1"  # an OpenAI-compatible server: here, llama.cpp
name = "ggml-org/LFM3-Omni-2B-GGUF:Q8_0"
timeout = 600  # seconds for one reply; a local model can be slow

# Sent to the server as written. The harness checks only the types of temperature,
# max_tokens and seed, and refuses model, messages, stream and n, which it sets itself.
[generation]
temperature = 0.7
max_tokens = 256
seed = 1  # respondent i gets seed + i - 1
top_k = 40

[run]
# The missing codes the model may give, where a question has them. Without this key the
# model gets no missing code: it must choose an answer.
missing = ["D", "R"]
# The missing code recorded when the model gives no allowed answer after three asks.
no_answer = "N"
# Inputs the route needs that no question asks: each drawn from its choices with the
# respondent's seed. An input neither drawn nor in [inputs] is sent as not known (null).
draw = ["self_employed", "earned_income", "born_in_us"]
system = """
You are a respondent in the General Social Survey. Answer each question as one adult
living in the United States would. Give only your answer.
"""

# Inputs given as written, by their names in the instrument.
[inputs]
last_year = 2009
are = "are"
do = "do"

# Extra text for the model about one question, keyed by the question's URN with its
# version. If the question changes, its version changes, and check-config refuses the
# prompt until you review it.
[prompts]
"urn:ddi:us.jhu:agekdbrn:6" = "Answer with a whole number of years."
